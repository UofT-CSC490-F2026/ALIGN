name: Arbiter training tests

on:
  pull_request:
  push:
    branches: [final-project]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r arbiter_training/requirements-test.txt
      - name: Test Person 2 code with full line and branch coverage
        run: >-
          python -m pytest
          arbiter_training/tests/test_arbiter_training.py
          arbiter_training/tests/test_arbiter_scripts.py
          arbiter_training/tests/test_arbiter_modal_offline.py
          arbiter_training/tests/test_merged_runner_integration.py
          --cov=arbiter_training
          --cov-config=arbiter_training/.coveragerc
          --cov-branch
          --cov-fail-under=100
          --cov-report=term-missing
