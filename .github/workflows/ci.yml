name: CI

on:
  pull_request:
  push:
    branches: [a2]
  workflow_dispatch:

# Tests never access AWS or deploy infrastructure.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-runner:
    name: Online smoke runner unit tests (no AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s infra/tests/e2e -v

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize and validate all Terraform roots and modules
        run: |
          for directory in \
            infra/bootstrap \
            infra/backup \
            infra/envs/dev \
            infra/envs/prod \
            infra/modules/network \
            infra/modules/storage \
            infra/modules/database \
            infra/modules/compute; do
            echo "::group::${directory}"
            terraform -chdir="${directory}" init -backend=false -input=false -no-color
            terraform -chdir="${directory}" validate -no-color
            echo "::endgroup::"
          done

      - name: Run mocked network module tests
        run: terraform -chdir=infra/modules/network test -no-color

      - name: Run mocked RDS module tests
        run: terraform -chdir=infra/modules/database test -no-color

      - name: Run mocked compute module tests
        run: terraform -chdir=infra/modules/compute test -no-color

  database:
    name: PostgreSQL and Flyway checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infra/modules/database
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Test fresh PostgreSQL schema, fixtures, and metrics
        shell: pwsh
        run: ./scripts/fresh_demo_test.ps1

      # Safe on the ephemeral CI runner: never touches a developer's local volume.
      - name: Clean up isolated CI database and test volume
        if: always()
        run: docker compose -p align_phase1_smoke down --volumes --remove-orphans

  python:
    name: Offline dataset pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install boto3 'psycopg[binary]>=3.2,<4'

      - name: Test raw ingestion and task normalization
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  task-loader-integration:
    name: Task loader PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: align
          POSTGRES_USER: align_dev
          POSTGRES_PASSWORD: local_dev_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U align_dev -d align"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'

      - name: Apply existing Flyway schema to disposable PostgreSQL
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/infra/modules/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.17.2 \
            -url=jdbc:postgresql://127.0.0.1:5432/align \
            -user=align_dev \
            -password=local_dev_only_change_me \
            -locations=filesystem:/flyway/sql migrate

      - name: Verify real SQL inserts, idempotency and rollback
        env:
          ALIGN_TEST_DATABASE_URL: postgresql://align_dev:local_dev_only_change_me@127.0.0.1:5432/align
        run: |
          python -m unittest discover -s scripts/tests -p 'test_load_tasks.py' -v
          python -m unittest discover -s scripts/tests -p 'test_process_runs.py' -v
