name: Runner coverage

on:
  pull_request:
  push:
    branches: [final-project]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: align
          POSTGRES_USER: align
          POSTGRES_PASSWORD: coverage_local_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U align -d align"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ALIGN_TEST_DATABASE_URL: postgresql://align:coverage_local_only@127.0.0.1:5432/align
      ALIGN_TEST_DOCKER_IMAGE: akhatua/cooperbench-pallets-click@sha256:497bb01824e4f2bc5a53db80446a61f3edaca5b5e4e5bf3100d423b11e11eb9a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-coverage.txt
      - name: Prepare integration fixtures
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in infra/modules/database/migrations/V*.sql; do
            docker exec -i "$PG_CONTAINER" psql -q -v ON_ERROR_STOP=1 -U align -d align < "$migration"
          done
          docker pull "$ALIGN_TEST_DOCKER_IMAGE"
      - name: Run pytest and collect line and branch coverage
        run: >-
          python -m pytest scripts/tests --cov --cov-branch --cov-fail-under=100
          --cov-report=term-missing --cov-report=json:coverage.json
      - name: Show coverage in the PR check summary
        if: always()
        run: |
          if [ ! -f coverage.json ]; then exit 0; fi
          python scripts/coverage_summary.py coverage.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-coverage
          path: coverage.json
          if-no-files-found: ignore

  publish-readme:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/final-project'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runner-coverage
      - name: Update coverage in README
        run: |
          python3 scripts/coverage_summary.py coverage.json --readme README.md
          git diff --quiet -- README.md && exit 0
          git add README.md
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Update runner coverage in README [skip ci]'
          git push origin HEAD:refs/heads/final-project
